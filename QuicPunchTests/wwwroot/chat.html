<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <title>Direct Chat · QuicPunch</title>
  <link rel="stylesheet" href="/app.css">
  <script defer src="/app.js"></script>
  <script defer src="/chat.js"></script>
</head>
<body data-page="chat">
<header class="topbar"><div class="topbar-inner"><div class="brand"><div class="brand-mark">QP</div><strong>QuicPunch</strong><span>Direct Chat</span></div><div class="top-actions"><span class="badge" id="chatStatusBadge">No conversation</span></div></div></header>
<div class="nav-wrap"><nav class="nav"><a class="nav-link" data-page="dashboard" href="/">Network</a><a class="nav-link" data-page="chat" href="/chat.html">Direct Chat</a><a class="nav-link" data-page="voice" href="/call.html">Voice Studio</a><a class="nav-link" data-page="vpn" href="/vpn.html">LAN Bridge</a><a class="nav-link" data-page="files" href="/files.html">RelayDrive</a></nav></div>
<main class="workspace chat-workspace">
  <div class="discord-chat">
    <aside class="dm-pane">
      <div class="dm-head"><div><strong>Direct messages</strong><span>Trusted peers</span></div></div>
      <div class="dm-search"><input class="input" id="chatPeerSearch" placeholder="Find a peer"></div>
      <div id="chatPeers" class="dm-list"></div>
    </aside>
    <section class="conversation-pane">
      <header class="conversation-head"><div class="conversation-identity"><div class="avatar large" id="chatAvatar">—</div><div><strong id="chatPeerName">Choose a peer</strong><span id="chatPeerMeta">Select someone from the left</span></div></div><button class="btn primary" id="chatConnectBtn" disabled>Connect chat</button></header>
      <div id="messages" class="messages discord-messages"><div class="empty">Choose a trusted peer from the left.</div></div>
      <div class="composer discord-composer"><button class="btn" id="attachBtn" disabled>+</button><textarea id="messageInput" class="textarea" placeholder="Message selected peer" disabled></textarea><button class="btn primary" id="sendBtn" disabled>Send</button><input id="fileInput" type="file" hidden></div>
    </section>
  </div>
</main>
</body>
</html>
